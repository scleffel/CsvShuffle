name: Publish image and Helm chart

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read release version
        id: version
        run: |
          VERSION="$(dotnet msbuild CsvShuffle/CsvShuffle.csproj -getProperty:Version -nologo)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$VERSION' is not a supported semantic version." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION has already been released; nothing to publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.version.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.version.outputs.should_publish == 'true'
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-

      - name: Build and push frontend image
        if: steps.version.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./CsvShuffle
          file: ./CsvShuffle/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Package Helm chart
        if: steps.version.outputs.should_publish == 'true'
        id: chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.value }}
        run: |
          helm package helm/csvshuffle \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Helm OCI registry
        if: steps.version.outputs.should_publish == 'true'
        env:
          HELM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$HELM_REGISTRY_TOKEN" | \
            helm registry login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Push Helm chart
        if: steps.version.outputs.should_publish == 'true'
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "csvshuffle-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Create GitHub release
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "CsvShuffle v${VERSION}" \
            --generate-notes \
            "csvshuffle-${VERSION}.tgz"
