name: Publish image and Helm chart

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./CsvShuffle
          file: ./CsvShuffle/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

      - name: Package Helm chart
        id: chart
        env:
          CHART_VERSION: 0.1.${{ github.run_number }}
        run: |
          helm package helm/csvshuffle \
            --version "$CHART_VERSION" \
            --app-version "${GITHUB_SHA}"
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Helm OCI registry
        env:
          HELM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$HELM_REGISTRY_TOKEN" | \
            helm registry login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Push Helm chart
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm push "csvshuffle-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
